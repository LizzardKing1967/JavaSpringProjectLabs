<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a th:href="@{/}">Главная</a></li>
            <li><a th:href="@{/products}">Каталог материалов</a></li>
            <li><a th:href="@{/about}">О магазине</a></li>
            <li><a th:href="@{/contact}">Контакты</a></li>
            <li><a th:href="@{/register}">Регистрация</a></li>
            <li><a th:href="@{/login}">Логин</a></li>
        </ul>
    </nav>
    <h1 th:text="${storeTitle}">Заголовок Магазина</h1>
</header>
<h2>Login</h2>
<form action="/login" method="post">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Login</button>
</form>

<!-- Показываем ошибку, если она есть -->
<div style="color: red;" th:if="${param.error != null}">
    Invalid username or password. Please try again.
</div>
<p>Don't have an account? <a href="/register">Register here</a></p>
</body>
</html>
