<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
<header>
    <h1>Магазин Строительных Материалов</h1>
    <nav>
        <ul>
            <li><a th:href="@{/}">Главная</a></li>
            <li><a th:href="@{/products}">Каталог</a></li>
            <li><a th:href="@{/register}">Регистрация</a></li>
            <li><a th:href="@{/login}">Логин</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2>Регистрация</h2>
    <form action="/register" method="post">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Зарегистрироваться</button>
    </form>

    <div th:if="${errorMessage != null}" class="validationError">
        <p th:text="${errorMessage}"></p>
    </div>
</main>

<footer>
    <p>© 2024 Магазин Строительных Материалов</p>
</footer>
</body>
</html>
