<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <link rel="stylesheet" href="/styles/styles.css">
    <script defer>
        async function submitOrder(event) {
            event.preventDefault(); // Отключаем стандартное поведение формы

            // Собираем данные из формы
            const orderData = {
                orderMaterialId: document.querySelector('#orderMaterialId').value,
                quantity: document.querySelector('#quantity').value,
                customerName: document.querySelector('#customerName').value,
                address: document.querySelector('#address').value
            };

            try {
                // Отправляем JSON на сервер
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert('Заказ успешно создан: ID ' + result.id);
                } else {
                    alert('Ошибка при создании заказа: ' + response.statusText);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Произошла ошибка при отправке заказа.');
            }
        }
    </script>
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a th:href="@{/}">Главная</a></li>
            <li><a th:href="@{/products}">Каталог материалов</a></li>
            <li><a th:href="@{/about}">О магазине</a></li>
            <li><a th:href="@{/contact}">Контакты</a></li>
            <li><a th:href="@{/register}">Регистрация</a></li>
            <li><a th:href="@{/login}">Логин</a></li>
        </ul>
    </nav>
    <h1 th:text="${storeTitle}">Заголовок Магазина</h1>
</header>

<main>
    <section>
        <form id="orderForm" onsubmit="submitOrder(event)">
            <input type="hidden" id="orderMaterialId" th:value="${material.id}">
            <h2 th:text="${material.name}">Название материала</h2>
            <p th:text="${material.description}">Описание материала</p>
            <p th:text="'Вес: ' + ${material.weight} + ' кг'">Вес материала</p>
            <p id="materialPrice" th:text="'Цена: ' + ${material.price} + ' ₽'">Цена материала</p>

            <div>
                <label for="quantity">Количество:</label>
                <input type="number" id="quantity" required oninput="updateTotalPrice()" />
                <br/>
            </div>

            <div>
                <label for="customerName">Имя:</label>
                <input type="text" id="customerName" required />
                <br/>
            </div>

            <div>
                <label for="address">Адрес:</label>
                <input type="text" id="address" required />
                <br/>
            </div>

            <button type="submit">Отправить заказ</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2024 Магазин Строительных Материалов</p>
</footer>
</body>
</html>
